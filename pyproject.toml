[project]
name = "trading-machine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "pyyaml>=6.0",
  "loguru>=0.7",
  "pyarrow>=15.0",
  "yfinance>=0.2.36",
  "matplotlib>=3.8",
  "alpaca-py>=0.21",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
  "quantstats>=0.0.63",
]



[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
